; Impala 접속 설정 (python analyze.py --from ... --to ... 실행 시 사용)
[impala]
host = localhost          ; Impala 서버 주소 (담당자에게 확인)
port = 21050              ; Impala 기본 포트
database =                ; 기본 DB (SQL 에 DB명.테이블명 으로 쓰면 비워둬도 됨)
auth_mechanism = NOSASL   ; 로그인 없음. 접속이 안 되면 PLAIN 으로 바꿔보세요
user =                    ; PLAIN 일 때 필요하면 아무 사용자명
use_ssl = false
timeout = 600             ; 쿼리 최대 대기 시간(초)
